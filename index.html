<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDCpedia — Red Dust Colony Encyclopedia</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="stage"><div id="game" aria-label="Red Dust Colony paused gameplay"><img src="assets/game-background.png" alt="Red Dust Colony — paused game"><button id="open-button" title="Open RDCpedia">Encyclopedia</button></div></div>
